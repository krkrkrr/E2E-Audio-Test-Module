[package]
name = "e2e-audio-firmware"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "RP2040 を USB Audio + CDC の複合デバイスにし、受けた音声を CDC で返すファーム"
publish = false

# ルートのワークスペースとはターゲットが違う（thumbv6m-none-eabi）ので独立させる
[workspace]

[dependencies]
capture-core = { path = "../capture-core" }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-rp = { version = "0.10.0", features = ["time-driver", "critical-section-impl", "rp2040"] }
embassy-usb = { version = "0.6.0" }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-futures = "0.1.2"
cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.0"
panic-halt = "1.0.0"
static_cell = "2.1.1"
portable-atomic = { version = "1.15", features = ["critical-section"] }

[profile.release]
debug = 2
lto = "fat"
opt-level = "s"
codegen-units = 1

[profile.dev]
opt-level = "s"
