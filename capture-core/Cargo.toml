[package]
name = "capture-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "ハードウェアに依存しないキャプチャデバイスの中核（audio-in と capture-link の状態機械）"

[lib]
path = "src/lib.rs"

[dev-dependencies]
proptest = "1"
cucumber = "0.21"
futures = "0.3"
serde_json = "1"

[[test]]
name = "audio_in"
path = "../test/integration/audio_in.rs"

[[test]]
name = "capture_link"
path = "../test/integration/capture_link.rs"

[[test]]
name = "features"
path = "../test/integration/features.rs"
harness = false

[[test]]
name = "unit_audio_in"
path = "../test/unit/audio_in.rs"

[[test]]
name = "unit_link"
path = "../test/unit/link.rs"

[[test]]
name = "unit_session"
path = "../test/unit/session.rs"

[[test]]
name = "unit_device"
path = "../test/unit/device.rs"
