[project]
name = "e2e-audio"
version = "0.1.0"
description = "E2E 音声テストのハーネス: キャプチャデバイスの CDC リンクを読み、録音を再構成する"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5", "numpy>=2"]

[project.optional-dependencies]
play = ["sounddevice>=0.5"]
test = ["pytest>=8", "hypothesis>=6", "pytest-bdd>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["e2e_audio"]
